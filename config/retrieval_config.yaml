embedding:
  model_name: "all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32

chunking:
  chunk_size: 500
  chunk_overlap: 50
  separator: "\n\n"

retrieval:
  top_k: 4
  similarity_threshold: 0.35
  metric: "cosine"

llm:
  provider: "groq"
  default_model: "openai/gpt-oss-20b"
  fallback_model: "openai/gpt-oss-120b"
  temperature: 0.1
  max_tokens: 1200
